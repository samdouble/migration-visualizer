name: Checks

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        node-version: ['24.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          database: postgres
          port: 5432
          username: postgres
          password: postgres
      - name: Install
        run: |
          npm install
      - name: Audit
        run: |
          npm audit --production --audit-level=moderate
      - name: Lint
        run: |
          npm run lint
      - name: Tests
        run: |
          npm run test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
      - name: Build
        run: |
          npm run build
      - name: Test CLI
        run: |
          echo "
            import type { Knex } from 'knex';
            const config: Knex.Config = {
              client: 'better-sqlite3',
              connection: {
                filename: ':memory:',
              },
              useNullAsDefault: true,
              migrations: {
                directory: './tests/fixtures/migrations/knex',
                extension: 'ts',
              },
            };
            export default config;
          " > knexfile.ts

          node dist/cli.js --help
          node dist/cli.js --version

          npm link
          migration-visualizer --help
          migration-visualizer --version
          migration-visualizer visualize --changed tests/fixtures/migrations/knex/20251227000006_create_likes.ts
