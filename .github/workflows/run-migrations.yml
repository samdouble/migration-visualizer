name: Run migrations

on: [pull_request]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ['22.21.1', '24.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Check migration status
        run: npm run migrate:status
      - name: Print table schemas
        run: npm run schema
      - name: Generate visualization
        id: visualize
        run: |
          npm run build
          DIAGRAM=$(npx migration-visualizer visualize)
          echo "diagram<<EOF" >> $GITHUB_OUTPUT
          echo "$DIAGRAM" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Add PR comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const prNumber = context.issue.number;
            const diagram = `${{ steps.visualize.outputs.diagram }}`;
            const message = `## Database Schema\n\n\`\`\`mermaid\n${diagram}\n\`\`\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });
