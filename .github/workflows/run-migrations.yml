name: Run migrations

on:
  push:
    branches: ["**"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ['22.21.1', '24.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Check migration status
        run: npm run migrate:status
      - name: Print table schemas
        run: npm run schema
