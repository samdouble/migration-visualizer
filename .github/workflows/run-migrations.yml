name: Run migrations

on: [pull_request]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ['22.21.1', '24.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Create Knexfile
        run: |
          echo "
            import type { Knex } from 'knex';
            const config: Knex.Config = {
              client: 'better-sqlite3',
              connection: {
                filename: ':memory:',
              },
              useNullAsDefault: true,
              migrations: {
                directory: './tests/fixtures/migrations/knex',
                extension: 'ts',
              },
            };
            export default config;
          " > knexfile.ts
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            migrations:
              - tests/fixtures/migrations/knex/**/*.ts
      - name: Generate visualization
        id: visualize
        env:
          CHANGED_MIGRATIONS: ${{ steps.changed-files.outputs.migrations_all_changed_files }}
        if: steps.changed-files.outputs.migrations_all_changed_files != ''
        run: |
          npm run build
          DIAGRAM=$(npx migration-visualizer visualize --changed $CHANGED_MIGRATIONS --orm knex)
          echo "diagram<<EOF" >> $GITHUB_OUTPUT
          echo "$DIAGRAM" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Add PR comment
        uses: actions/github-script@v8
        if: steps.changed-files.outputs.migrations_all_changed_files != ''
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const prNumber = context.issue.number;
            const diagram = `${{ steps.visualize.outputs.diagram }}`;
            const message = `## Database Schema\n\n\`\`\`mermaid\n${diagram}\n\`\`\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });
